<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tibia Dungeons</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; background: #0d1117; color: #c9d1d9; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, sans-serif; }
      #phaser { width: 100vw; height: 100vh; }
      .equipment-panel {
        position: fixed;
        right: 14px;
        top: 14px;
        width: 250px;
        padding: 10px;
        border: 1px solid #3c4857;
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(19, 29, 42, 0.92) 0%, rgba(10, 17, 28, 0.92) 100%);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        z-index: 6;
      }
      .loot-panel {
        position: fixed;
        right: 14px;
        top: 340px;
        width: 250px;
        padding: 10px;
        border: 1px solid #3c4857;
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(19, 29, 42, 0.92) 0%, rgba(10, 17, 28, 0.92) 100%);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        z-index: 6;
      }
      .equipment-title {
        margin: 0 0 8px;
        color: #cbd5e1;
        font-size: 14px;
        letter-spacing: 0.3px;
      }
      .loot-title {
        margin: 0 0 8px;
        color: #cbd5e1;
        font-size: 13px;
        letter-spacing: 0.3px;
      }
      .equipment-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .equipment-slot.spacer {
        border: none;
        background: transparent;
        box-shadow: none;
      }
      .equipment-slot {
        height: 62px;
        border: 1px solid #445469;
        border-radius: 8px;
        background: linear-gradient(180deg, #334155 0%, #1f2937 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: #9fb2c8;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.6);
      }
      .equipment-slot .icon {
        font-size: 12px;
        line-height: 1;
        margin-bottom: 4px;
      }
      .equipment-slot .icon-img {
        width: 28px;
        height: 28px;
        object-fit: contain;
        image-rendering: pixelated;
        margin-bottom: 4px;
        display: none;
      }
      .equipment-slot .label {
        font-size: 10px;
        line-height: 1;
      }
      .equipment-foot {
        margin-top: 8px;
        font-size: 11px;
        color: #94a3b8;
      }
      .loot-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        max-height: 240px;
        overflow: auto;
        padding-right: 2px;
      }
      .loot-slot {
        height: 36px;
        border: 1px solid #445469;
        border-radius: 6px;
        background: linear-gradient(180deg, #334155 0%, #1f2937 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8ea1b5;
        font-size: 11px;
      }
      .loot-slot img {
        width: 22px;
        height: 22px;
        object-fit: contain;
        image-rendering: pixelated;
      }
      .loot-foot {
        margin-top: 8px;
        font-size: 11px;
        color: #94a3b8;
      }
      .item-tooltip {
        position: fixed;
        z-index: 30;
        max-width: 420px;
        max-height: 60vh;
        overflow: auto;
        padding: 10px;
        border: 1px solid #475569;
        border-radius: 8px;
        background: rgba(2, 6, 23, 0.96);
        color: #e2e8f0;
        font-size: 11px;
        line-height: 1.35;
        white-space: pre-wrap;
        pointer-events: none;
        display: none;
      }
      @media (max-width: 1120px) {
        .equipment-panel { width: 210px; }
        .equipment-slot { height: 56px; }
        .loot-panel { width: 210px; top: 330px; }
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(8, 12, 18, 0.9);
        display: grid;
        place-items: center;
        z-index: 10;
      }
      .panel {
        width: min(760px, 92vw);
        background: #111827;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 18px;
      }
      .row { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
      input[type="text"] {
        flex: 1;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #374151;
        background: #0f172a;
        color: #e5e7eb;
      }
      button {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #1f2937;
        color: #f9fafb;
        cursor: pointer;
      }
      .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
      .choice {
        border: 1px solid #374151;
        border-radius: 10px;
        padding: 8px;
        background: #0f172a;
        cursor: pointer;
      }
      .choice.active { outline: 2px solid #60a5fa; }
      .choice img { width: 92px; height: 92px; image-rendering: pixelated; display: block; margin: 0 auto 6px; }
      .hint { margin-top: 10px; color: #9ca3af; font-size: 13px; }
    </style>
    <script src="https://unpkg.com/phaser@3/dist/phaser.min.js"></script>
  </head>
  <body>
    <div id="phaser"></div>
    <aside class="equipment-panel" aria-label="Equipment panel">
      <h3 class="equipment-title">Equipment</h3>
      <div class="equipment-grid">
        <div class="equipment-slot" id="slotAmulet">
          <img class="icon-img" id="slotAmuletImg" alt="Amulet item icon" />
          <div class="icon" id="slotAmuletIcon">NECK</div>
          <div class="label" id="slotAmuletLabel">Empty</div>
        </div>
        <div class="equipment-slot" id="slotHelmet">
          <img class="icon-img" id="slotHelmetImg" alt="Helmet item icon" />
          <div class="icon" id="slotHelmetIcon">HEAD</div>
          <div class="label" id="slotHelmetLabel">Empty</div>
        </div>
        <div class="equipment-slot" id="slotBag">
          <img class="icon-img" id="slotBagImg" alt="Bag item icon" />
          <div class="icon" id="slotBagIcon">BAG</div>
          <div class="label" id="slotBagLabel">Empty</div>
        </div>
        <div class="equipment-slot" id="slotHand">
          <img class="icon-img" id="slotHandImg" alt="Weapon item icon" />
          <div class="icon" id="slotHandIcon">HAND</div>
          <div class="label" id="slotHandLabel">Empty</div>
        </div>
        <div class="equipment-slot" id="slotArmor">
          <img class="icon-img" id="slotArmorImg" alt="Armor item icon" />
          <div class="icon" id="slotArmorIcon">BODY</div>
          <div class="label" id="slotArmorLabel">Empty</div>
        </div>
        <div class="equipment-slot" id="slotShield">
          <img class="icon-img" id="slotShieldImg" alt="Shield item icon" />
          <div class="icon" id="slotShieldIcon">SHLD</div>
          <div class="label" id="slotShieldLabel">Empty</div>
        </div>
        <div class="equipment-slot" id="slotRing">
          <img class="icon-img" id="slotRingImg" alt="Ring item icon" />
          <div class="icon" id="slotRingIcon">RING</div>
          <div class="label" id="slotRingLabel">Empty</div>
        </div>
        <div class="equipment-slot" id="slotLegs">
          <img class="icon-img" id="slotLegsImg" alt="Legs item icon" />
          <div class="icon" id="slotLegsIcon">LEGS</div>
          <div class="label" id="slotLegsLabel">Empty</div>
        </div>
        <div class="equipment-slot" id="slotAmmo">
          <img class="icon-img" id="slotAmmoImg" alt="Ammunition item icon" />
          <div class="icon" id="slotAmmoIcon">AMMO</div>
          <div class="label" id="slotAmmoLabel">Empty</div>
        </div>
        <div class="equipment-slot spacer" aria-hidden="true"></div>
        <div class="equipment-slot" id="slotBoots">
          <img class="icon-img" id="slotBootsImg" alt="Boots item icon" />
          <div class="icon" id="slotBootsIcon">FEET</div>
          <div class="label" id="slotBootsLabel">Empty</div>
        </div>
        <div class="equipment-slot spacer" aria-hidden="true"></div>
      </div>
      <div class="equipment-foot" id="equipmentFoot">No item equipped</div>
    </aside>
    <aside class="loot-panel" aria-label="Loot panel">
      <h3 class="loot-title">Loot Bag</h3>
      <div class="loot-grid" id="lootGrid"></div>
      <div class="loot-foot" id="lootFoot">Capacity: 0 slots</div>
    </aside>
    <div id="itemTooltip" class="item-tooltip" aria-hidden="true"></div>

    <div class="overlay" id="startOverlay">
      <div class="panel">
        <h2>Character Selection</h2>
        <div class="row">
          <label for="playerName">Name:</label>
          <input id="playerName" type="text" maxlength="12" placeholder="Your character" />
        </div>
        <div class="choices">
          <div class="choice active" data-sex="male" id="choiceMale">
            <img src="./data/images/outfit/Outfit Citizen Male.gif" alt="Outfit Citizen Male" />
            <strong>Male</strong>
            <div>Outfit Citizen Male</div>
          </div>
          <div class="choice" data-sex="female" id="choiceFemale">
            <img src="./data/images/outfit/Outfit Citizen Female Addon 1.gif" alt="Outfit Citizen Female Addon 1" />
            <strong>Female</strong>
            <div>Outfit Citizen Female Addon 1</div>
          </div>
        </div>
        <div class="row">
          <button id="startBtn">Enter Dungeon</button>
        </div>
        <div class="hint">Press Enter to start quickly.</div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
