<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tibia Dungeons 3D — Free Browser Dungeon Crawler RPG</title>
    <meta
      name="description"
      content="Play Tibia Dungeons free in your browser — a 3D roguelite dungeon crawler inspired by Tibia. Descend through procedurally generated floors, loot rare gear and level up your Knight, Paladin, Sorcerer or Druid."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <meta name="theme-color" content="#e2a030" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0b14;
        font-family: 'Segoe UI', system-ui, sans-serif;
        user-select: none;
      }
      #app {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* HUD overlay (ADR-003): transparent to input except its own panels. */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #eee;
      }
      #player-bars {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        width: 260px;
      }
      .bar {
        position: relative;
        height: 18px;
        border: 1px solid #000;
        border-radius: 4px;
        background: #221c2c;
        overflow: hidden;
        box-shadow: 0 0 0 1px #55486b, 0 2px 8px rgba(0, 0, 0, 0.6);
      }
      .bar-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(#d6403a, #8f1f1c);
        transition: width 120ms linear;
      }
      .bar-text {
        position: absolute;
        inset: 0;
        text-align: center;
        font-size: 12px;
        line-height: 18px;
        text-shadow: 0 1px 2px #000;
      }
      #fps {
        display: none;
        position: absolute;
        top: 10px;
        right: 12px;
        font: 13px/1.2 monospace;
        color: #8f8;
        text-shadow: 0 1px 2px #000;
      }
      .damage-floater {
        position: absolute;
        transform: translate(-50%, -100%);
        font-weight: 700;
        font-size: 15px;
        text-shadow: 0 1px 3px #000;
        opacity: 0;
        pointer-events: none;
      }
      .damage-floater[data-kind='hit'] {
        color: #ffd76a;
      }
      .damage-floater[data-kind='crit'] {
        color: #ff9d2e;
        font-size: 19px;
      }
      .damage-floater[data-kind='miss'] {
        color: #aab;
      }
      .damage-floater[data-kind='incoming'] {
        color: #ff5b52;
      }
      .damage-floater.floating {
        animation: float-up 0.9s ease-out forwards;
      }
      @keyframes float-up {
        0% {
          opacity: 1;
          margin-top: 0;
        }
        100% {
          opacity: 0;
          margin-top: -46px;
        }
      }
      #death-panel {
        display: none;
        position: absolute;
        inset: 0;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: rgba(8, 5, 12, 0.78);
        pointer-events: auto;
      }
      #death-panel h1 {
        color: #d6403a;
        letter-spacing: 2px;
      }
      #respawn-btn {
        padding: 10px 26px;
        font-size: 16px;
        cursor: pointer;
        background: #2c2438;
        color: #eee;
        border: 1px solid #55486b;
        border-radius: 6px;
      }
      #respawn-btn:hover {
        background: #3a3050;
      }
      #controls-hint {
        position: absolute;
        left: 12px;
        bottom: 12px;
        font-size: 12px;
        color: #99a;
        text-shadow: 0 1px 2px #000;
      }
      #floor-indicator {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        letter-spacing: 2px;
        color: #d9a441;
        text-shadow: 0 1px 3px #000;
      }
      #fade {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 420ms ease;
        z-index: 10;
      }
      #fade.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">
      <div id="player-bars">
        <div class="bar">
          <div class="bar-fill" id="hp-fill"></div>
          <div class="bar-text" id="hp-text"></div>
        </div>
      </div>
      <div id="fps"></div>
      <div id="floor-indicator"></div>
      <div id="controls-hint">Click: move / attack · Right-drag: rotate · Wheel: zoom · F3: FPS</div>
      <div id="death-panel">
        <h1>YOU DIED</h1>
        <button id="respawn-btn">Respawn</button>
      </div>
    </div>
    <div id="fade"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
