<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="55%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2a030" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e2a030" stop-opacity="0"/>
    </radialGradient>
    <!-- Scanline filter -->
    <pattern id="scanlines" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="2" fill="transparent"/>
      <rect y="2" width="1200" height="2" fill="rgba(0,0,0,0.06)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Dungeon floor tiles (bottom area) -->
  <rect x="0" y="460" width="1200" height="170" fill="#110d07"/>
  <rect x="0" y="460" width="1200" height="3" fill="#2a1e0e"/>
  <!-- Floor grid lines -->
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#1a1208" stroke-width="1"/>
  <line x1="150" y1="460" x2="150" y2="630" stroke="#1a1208" stroke-width="1"/>
  <line x1="300" y1="460" x2="300" y2="630" stroke="#1a1208" stroke-width="1"/>
  <line x1="450" y1="460" x2="450" y2="630" stroke="#1a1208" stroke-width="1"/>
  <line x1="600" y1="460" x2="600" y2="630" stroke="#1a1208" stroke-width="1"/>
  <line x1="750" y1="460" x2="750" y2="630" stroke="#1a1208" stroke-width="1"/>
  <line x1="900" y1="460" x2="900" y2="630" stroke="#1a1208" stroke-width="1"/>
  <line x1="1050" y1="460" x2="1050" y2="630" stroke="#1a1208" stroke-width="1"/>

  <!-- Glow behind title -->
  <ellipse cx="600" cy="280" rx="420" ry="200" fill="url(#glow)"/>

  <!-- Dungeon wall blocks left and right -->
  <rect x="0" y="0" width="80" height="630" fill="#0d0a06" opacity="0.7"/>
  <rect x="1120" y="0" width="80" height="630" fill="#0d0a06" opacity="0.7"/>
  <!-- Wall bricks left -->
  <rect x="10" y="20" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="10" y="60" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="10" y="100" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="10" y="140" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="10" y="180" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="10" y="220" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="10" y="260" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="10" y="300" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="10" y="340" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="10" y="380" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="10" y="420" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <!-- Wall bricks right -->
  <rect x="1135" y="20" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="1135" y="60" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="1135" y="100" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="1135" y="140" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="1135" y="180" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="1135" y="220" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="1135" y="260" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="1135" y="300" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="1135" y="340" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="1135" y="380" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>
  <rect x="1135" y="420" width="55" height="30" rx="2" fill="#1a1208" stroke="#2a1e0e" stroke-width="1"/>

  <!-- Torch flame left -->
  <ellipse cx="80" cy="200" rx="18" ry="30" fill="#e2a030" opacity="0.15"/>
  <ellipse cx="80" cy="210" rx="8" ry="18" fill="#e2a030" opacity="0.6"/>
  <ellipse cx="80" cy="218" rx="5" ry="10" fill="#fff3b0" opacity="0.8"/>
  <rect x="76" y="228" width="8" height="14" rx="2" fill="#5a3a10"/>
  <!-- Torch flame right -->
  <ellipse cx="1120" cy="200" rx="18" ry="30" fill="#e2a030" opacity="0.15"/>
  <ellipse cx="1120" cy="210" rx="8" ry="18" fill="#e2a030" opacity="0.6"/>
  <ellipse cx="1120" cy="218" rx="5" ry="10" fill="#fff3b0" opacity="0.8"/>
  <rect x="1116" y="228" width="8" height="14" rx="2" fill="#5a3a10"/>

  <!-- Main title -->
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="bold" fill="#e2a030" letter-spacing="4">TIBIA</text>
  <text x="600" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="bold" fill="#c8c8c8" letter-spacing="12">DUNGEONS</text>

  <!-- Subtitle / tagline -->
  <text x="600" y="385" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" fill="#94a3b8" letter-spacing="2">Free Browser Dungeon Crawler RPG</text>

  <!-- Feature pills -->
  <rect x="155" y="415" width="160" height="34" rx="17" fill="#1e2d44" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="235" y="437" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#94c8e8">20 Dungeon Floors</text>

  <rect x="335" y="415" width="160" height="34" rx="17" fill="#1e2d44" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="415" y="437" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#94c8e8">4 Character Classes</text>

  <rect x="515" y="415" width="170" height="34" rx="17" fill="#1e2d44" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="600" y="437" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#94c8e8">Rare Loot System</text>

  <rect x="705" y="415" width="160" height="34" rx="17" fill="#1e2d44" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="785" y="437" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#94c8e8">Hall of Fame</text>

  <rect x="885" y="415" width="160" height="34" rx="17" fill="#1e2d44" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="965" y="437" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#94c8e8">Play for Free</text>

  <!-- URL badge -->
  <rect x="400" y="562" width="400" height="40" rx="20" fill="rgba(226,160,48,0.12)" stroke="#e2a030" stroke-width="1" stroke-opacity="0.5"/>
  <text x="600" y="587" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#e2a030" letter-spacing="1">www.tibia-dungeons.com</text>

  <!-- Scanlines overlay -->
  <rect width="1200" height="630" fill="url(#scanlines)"/>
</svg>
